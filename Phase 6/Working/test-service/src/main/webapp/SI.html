<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest</title>
</head>
<body>
    <H1>SI</H1>
    <form action="simpleInterest" method="get">
        Principle: <input type="number" name="principle" step="any"><br>
        Time(in year(s)): <input type="number" name="time" step="any"><br>
        Rate: <input type="number" name="rate" step="any"><br>
        Result: <%= request.getParameter("result") %>
        <input type="submit" value="Calculate">
    </form>
</body>
</html>
