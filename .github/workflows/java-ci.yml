name: Java Learning CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  maven-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "JavaFX-CodeBase/foundations/hello-world_01"
          - "JavaFX-CodeBase/projects/dataviewer"
          - "JavaFX-CodeBase/projects/user-auth-via-jdbc"
          - "Phase 7/working-with-hibernate/tutorial-one"
          - "Phase 7/working-with-hibernate/tutorial-two"
          - "Phase 7/working-with-hibernate/tutorial-three"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build ${{ matrix.module }}
        run: mvn -f "${{ matrix.module }}/pom.xml" clean install
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.module }}-artifact
          path: ${{ matrix.module }}/target/*.jar
          if-no-files-found: ignore

  raw-java-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Compile each raw Java file independently
        run: |
          mkdir -p /tmp/build-out
          find "Phase 1" "Phase 2" "Phase 3" "Phase 4" "Phase 5" "Phase 6" \
               "Phase 7/Concurrency & Multithreading in JAVA" "Phase 7/Design Patterns" \
               -name "*.java" 2>/dev/null | while read -r file; do
            echo "Compiling: $file"
            javac -d /tmp/build-out "$file" 2>&1 || echo "FAILED: $file"
          done
